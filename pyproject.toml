[project]
name = "pdf2md"
version = "0.1.0"
description = "CLI tool to convert lecture slides in PDF format into clean Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=2.2",
    "pymupdf4llm>=2.2",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
